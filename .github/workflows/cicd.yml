name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc-s3 dagshub boto3

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc storage (DagsHub / S3 / GCP), pull du lieu, huan luyen, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc-s3 dagshub boto3

      - name: Configure DagsHub / Cloud Storage Credentials
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          if [ -n "$DAGSHUB_TOKEN" ]; then
            echo "Configuring DagsHub credentials..."
            dvc remote modify origin --local access_key_id "$DAGSHUB_TOKEN"
            dvc remote modify origin --local secret_access_key "$DAGSHUB_TOKEN"
            echo "AWS_ACCESS_KEY_ID=$DAGSHUB_TOKEN" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=$DAGSHUB_TOKEN" >> $GITHUB_ENV
            echo "AWS_ENDPOINT_URL=https://dagshub.com/api/v1/repo-buckets/s3/${DAGSHUB_REPO_OWNER}/${DAGSHUB_REPO_NAME}" >> $GITHUB_ENV
            echo "MLFLOW_TRACKING_URI=https://dagshub.com/${DAGSHUB_REPO_OWNER}/${DAGSHUB_REPO_NAME}.mlflow" >> $GITHUB_ENV
            echo "MLFLOW_TRACKING_USERNAME=$DAGSHUB_REPO_OWNER" >> $GITHUB_ENV
            echo "MLFLOW_TRACKING_PASSWORD=$DAGSHUB_TOKEN" >> $GITHUB_ENV
          elif [ -n "$STORAGE_CREDENTIALS" ]; then
            echo "$STORAGE_CREDENTIALS" > /tmp/sa-key.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          fi

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to DagsHub / Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket_name = os.environ.get("ARTIFACT_BUCKET", "dvc")
          endpoint_url = os.environ.get("AWS_ENDPOINT_URL")
          aws_key = os.environ.get("AWS_ACCESS_KEY_ID")
          aws_secret = os.environ.get("AWS_SECRET_ACCESS_KEY")

          if aws_key and aws_secret:
              s3_client = boto3.client(
                  "s3",
                  endpoint_url=endpoint_url,
                  aws_access_key_id=aws_key,
                  aws_secret_access_key=aws_secret,
              )
              s3_client.upload_file("models/model.joblib", bucket_name, "artifacts/current/model.joblib")
              print("Uploaded models/model.joblib to DagsHub/S3 storage.")
          elif os.path.exists("/tmp/sa-key.json"):
              from google.cloud import storage
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob("artifacts/current/model.joblib")
              blob.upload_from_filename("models/model.joblib")
              print("Uploaded models/model.joblib to Google Cloud Storage.")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          import sys

          f1 = float("${{ needs.train.outputs.f1 }}")
          print(f"Evaluated F1 score: {f1:.4f}")
          if f1 < 0.65:
              sys.exit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print("PASSED: f1_score >= 0.65. Cho phep trien khai.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len Serving Server / VM.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: Deploy to Serving Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "Deploying via SSH to $SERVER_HOST..."
            mkdir -p ~/.ssh
            echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "sudo systemctl restart income-api && sleep 5 && curl -sf http://localhost:8080/healthz"
          else
            echo "Running serving test in runner environment..."
            python src/serve.py &
            PID=$!
            sleep 4
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
            kill $PID
          fi
